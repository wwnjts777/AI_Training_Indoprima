[project]
name = "coba"
version = "0.1.0"
description = "coba using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "celery>=5.6.3",
    "crewai[tools]==1.14.4",
    "fastapi[standard]>=0.136.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
kickoff = "coba.main:kickoff"
run_crew = "coba.main:kickoff"
plot = "coba.main:plot"
run_with_trigger = "coba.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
